---
# The store that keeps the same file in the same place and makes it useless to anyone who
# has not been given the key. §11 asks for exactly this: credentials that come from
# Semaphore's secret store or `ansible-vault`, injected at run time. The key is injected;
# what it protects is at rest beside the run, and the two are never in the same place.
#
# What it does not do is put the password where an operator can read it in a web interface.
# Getting one back is `ansible-vault view --vault-password-file` against the file this
# writes -- an ordinary vault file, deliberately, so the tool that opens it is one an
# Ansible estate already has. ADR-0027 has the rest, including why this is not Semaphore.

- name: Refuse to write a secret nobody gave the key for
  ansible.builtin.assert:
    that: common_secret_vault_password | length > 0
    fail_msg: >-
      common_secret_store is vault and no vault password was given. Set
      BASEWRIGHT_VAULT_PASSWORD in the run's environment -- under Semaphore that is a
      secret of type env on the Basewright environment. Refusing here is the point: the
      alternative is a generated password written somewhere that only looks protected.

# Read as bytes rather than with the `file` lookup, and that is load-bearing. The `file`
# lookup decrypts a vaulted file using the run's own vault secrets, so it fails on a file
# this store wrote unless the run was started with the same password configured a second
# way. Slurping the bytes and decrypting them with the key this role was handed is the
# whole difference.
- name: Read the bytes the store is holding
  ansible.builtin.slurp:
    src: "{{ common_secret_path }}"
  delegate_to: localhost
  become: false
  when: common_secret_held.stat.exists
  register: common_secret_bytes
  no_log: true

# One of two things, never both: what the store already had, or something new. A second
# apply of the same plan must hand back the first password rather than roll a second one,
# which would lock out whoever was given the first.
- name: Decrypt what the store holds, generating it the first time
  ansible.builtin.set_fact:
    common_secret_value: >-
      {{ (common_secret_bytes.content | b64decode
          | ansible.builtin.unvault(common_secret_vault_password))
         if common_secret_held.stat.exists
         else lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}
    common_secret_is_new: "{{ not common_secret_held.stat.exists }}"
  no_log: true

# `decrypt: false`, and it is not optional. `copy` stages `content` through a local file and
# decrypts anything that starts with $ANSIBLE_VAULT on the way past, so without this the
# task fails on the value it was just asked to write.
#
# Only when the store had nothing. Encrypting the same value twice produces different bytes
# every time -- a fresh salt, correctly -- so a write on every run would report a change on
# every run and this role would have no idempotence to speak of.
- name: Write it back where only the key opens it
  ansible.builtin.copy:
    content: "{{ common_secret_value | ansible.builtin.vault(common_secret_vault_password) }}"
    dest: "{{ common_secret_path }}"
    decrypt: false
    mode: "0600"
  delegate_to: localhost
  become: false
  when: common_secret_is_new | bool
  no_log: true
