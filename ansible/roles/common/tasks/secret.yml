---
# One secret, stored once. Included per secret the plan names, and the whole of what apply
# does about secrets: it makes sure a value exists at the location the plan names, and
# hands it to the caller in memory.
#
# The store is a seam, not a detail. Semaphore's own secret store is the real target and it
# is reached through the Semaphore templates in Phase B; a container under molecule has no
# such thing and needs one anyway. So the sink is chosen by `common_secret_store`, and
# the engine role that calls this never learns which one answered -- adding the second
# implementation means adding a file beside this one, not editing anything that uses it.
#
# The tasks that touch a value are no_log. Not because one might print a password by
# accident, but because a task that handles one prints it by default: Ansible logs its own
# arguments, and that is where a secret leaks from.

- name: Refuse a store nothing implements
  ansible.builtin.assert:
    that: common_secret_store in common_secret_stores
    fail_msg: >-
      common_secret_store is {{ common_secret_store }}, and the stores this
      installation can write to are: {{ common_secret_stores | join(', ') }}. A secret
      written somewhere nobody can find it is worse than one that was never generated.

- name: Make sure the store has somewhere to put it
  ansible.builtin.file:
    path: "{{ common_secret_path | dirname }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Find out whether this secret already exists
  ansible.builtin.stat:
    path: "{{ common_secret_path }}"
  delegate_to: localhost
  become: false
  register: common_secret_held

# `password` generates on first use and returns what it generated on every use after, which
# is the behaviour a store has to have: a second apply of the same plan must not roll a new
# password and lock out whoever was given the first one. It is also what makes this step
# idempotent, which the step that *uses* the value cannot be on its own.
- name: Read what the store holds, generating it the first time
  ansible.builtin.set_fact:
    common_secret_value: >-
      {{ lookup('password', common_secret_path ~ ' length=32 chars=ascii_letters,digits') }}
    common_secret_is_new: "{{ not common_secret_held.stat.exists }}"
  no_log: true

- name: Let nobody else read it
  ansible.builtin.file:
    path: "{{ common_secret_path }}"
    mode: "0600"
  delegate_to: localhost
  become: false
