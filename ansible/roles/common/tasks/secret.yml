---
# One secret, stored once. Included per secret the plan names, and the whole of what apply
# does about secrets: it makes sure a value exists at the location the plan names, and
# hands it to the caller in memory.
#
# This file decides nothing except which implementation answers. Every store keeps the same
# two-part promise -- `common_secret_value` is what is held, and `common_secret_is_new` says
# whether this run is what generated it -- and the engine role that called this never learns
# which one answered. Adding a third store is `secret_<name>.yml` beside these two and its
# name in `common_secret_stores`; it is not an edit to anything that calls this.
#
# The stores that ship are both on the control node, and they differ in one thing: whether
# what lands there can be read by anyone who can read the file. `file` says yes, which is
# what a container under molecule needs; `vault` says no, and wants a key it is given rather
# than one it keeps. ADR-0027 is why the second one is ansible-vault rather than Semaphore's
# own store, and docs/dev/STATUS.md says what neither of them solves.
#
# The tasks that touch a value are no_log. Not because one might print a password by
# accident, but because a task that handles one prints it by default: Ansible logs its own
# arguments, and that is where a secret leaks from.

- name: Refuse a store nothing implements
  ansible.builtin.assert:
    that: common_secret_store in common_secret_stores
    fail_msg: >-
      common_secret_store is {{ common_secret_store }}, and the stores this
      installation can write to are: {{ common_secret_stores | join(', ') }}. A secret
      written somewhere nobody can find it is worse than one that was never generated.

- name: Make sure the store has somewhere to put it
  ansible.builtin.file:
    path: "{{ common_secret_path | dirname }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Find out whether this secret already exists
  ansible.builtin.stat:
    path: "{{ common_secret_path }}"
  delegate_to: localhost
  become: false
  register: common_secret_held

- name: Ask the store this installation keeps its secrets in
  ansible.builtin.include_tasks: "secret_{{ common_secret_store }}.yml"

- name: Let nobody else read it
  ansible.builtin.file:
    path: "{{ common_secret_path }}"
    mode: "0600"
  delegate_to: localhost
  become: false
