---
# One secret, stored and then set on the running cluster. Storing it is shared -- every
# engine does that the same way, and where it goes is a seam the common role owns. Setting
# it is not: which role has a password, and how a password is set on it, is exactly the
# kind of thing an engine's role knows and the core does not.

- name: Make sure the store holds this secret
  ansible.builtin.include_role:
    name: common
    tasks_from: secret

# Nothing on a command line. A password in argv is readable by every process on the host
# through `ps`, and it lands in shell history and in the task log besides -- which is why
# the statement goes in over stdin and the whole task is silent (ADR-0007).
- name: Set it on the cluster, over the local socket, without it appearing anywhere
  ansible.builtin.command:
    argv:
      - psql
      - --no-psqlrc
      - --quiet
      - --set=ON_ERROR_STOP=1
      - --file=-
      - --port={{ basewright_plan.request.port }}
    # Dollar quoted rather than wrapped in apostrophes. The delimiter cannot occur in a
    # generated password, so there is nothing to escape and no way to get the escaping
    # wrong -- which is the whole risk in putting a value nobody may see into a statement.
    stdin: >-
      ALTER ROLE {{ basewright_plan.layout.service_account.name }}
      PASSWORD $basewright${{ common_secret_value }}$basewright$;
  become: true
  become_user: "{{ basewright_plan.layout.service_account.name }}"
  no_log: true
  # Only when the store had nothing and has just generated one. A second apply of the same
  # plan leaves the password alone: rolling it would lock out whoever was given the first
  # one, and it is what makes this step idempotent rather than merely quiet about not being.
  when: common_secret_is_new | bool
  changed_when: true
