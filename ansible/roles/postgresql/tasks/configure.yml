---
# The configuration files the plan names, rendered from the templates it names them by.

- name: Write the configuration files the plan names
  ansible.builtin.template:
    src: "{{ basewright_plan | basewright_template(item.template) }}"
    dest: "{{ item.destination }}"
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
    # A file that already exists is copied aside before it is replaced, with the moment in
    # the name of the copy. Apply creates and configures; it does not overwrite something
    # somebody may have edited without leaving them what they had.
    backup: true
  loop: "{{ basewright_plan.configuration }}"
  loop_control:
    label: "{{ item.id }} at {{ item.destination }}"
  become: true
  notify: Restart the instance
  # The plan, under one name, is the whole of what a configuration template is rendered
  # with. One variable rather than several, so that a template cannot reach for something
  # the plan does not carry and cannot collide with a name Ansible already uses.
  vars:
    plan: "{{ basewright_plan }}"
