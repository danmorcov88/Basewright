---
# An example, and only that. The real inventory lives in Semaphore, which is the interface
# (ADR-0005) and the thing that holds the key material.
#
# Two constraints are visible here and both are decisions rather than style. Targets are
# reached by one dedicated technical account, never by a person's own key (ADR-0006). And
# no credential appears in an inventory at all -- it comes from Semaphore's secret store or
# from ansible-vault, injected when the task runs (ADR-0007), which is why there is nothing
# here that would be worth stealing.
all:
  vars:
    ansible_user: basewright
    ansible_python_interpreter: auto_silent

  hosts:
    db-01.example.invalid:
      ansible_host: 10.0.0.11
    db-02.example.invalid:
      ansible_host: 10.0.0.12
