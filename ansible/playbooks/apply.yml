---
# The step that changes a machine, and the only one that does. Semaphore runs this; it does
# not run the CLI (ADR-0020).
#
# Four things have to be true before a single task touches the host, and all four are
# settled here rather than inside a role, because a role that could be run without them is
# a role somebody will run without them:
#
#   the plan is a plan, and this build understands its contract;
#   the plan has not been edited since it was approved;
#   the machine is still the one the plan was built from;
#   and any warnings on it have been acknowledged by somebody.
#
# The first two are one check. `basewright plan --from` validates the document against the
# frozen contract and recomputes the digest its name is taken over, so a plan of a version
# this build does not implement, and a plan somebody has edited, are both refused by the
# tool that produced them rather than by a second opinion written in YAML.
- name: Apply a plan
  # The host comes out of the plan, which is why the Apply template has no host field (§12).
  # A plan is built from one machine's facts and refuses to be applied to another, so asking
  # an operator to name the host as well would be asking them to repeat something the
  # artifact already carries -- and to be the one who gets it wrong. `basewright_hosts` is
  # still honoured, because somebody running this by hand may have a reason.
  hosts: >-
    {{ basewright_hosts | default(
         (lookup('file', basewright_plan_file | default(
            basewright_plan_store | default(playbook_dir ~ '/../../plans', true)
            ~ '/plans/' ~ basewright_plan_id ~ '.json', true))
          | from_json).request.host, true) }}
  gather_facts: true

  vars:
    # The plan to apply, named one of two ways. There is no other input, and that is the
    # whole design: if apply needs a value this document does not carry, the document is
    # incomplete and the plan step is where that gets fixed.
    #
    # A path is what somebody running this by hand has. An id is what §12 gives the Apply
    # template, and it is the more interesting of the two: an id is a digest of the plan's
    # own content, so it survives being copied out of a task log into a change request and
    # back into a survey field, which a path on somebody else's disk does not.
    # Defaulted in two places, and it has to be: `hosts:` is resolved before a play's vars
    # exist, so the line above carries its own copy of this default. Under Semaphore neither
    # is used -- the environment sets it to the volume the plans live on, which is the whole
    # reason the store is durable.
    basewright_plan_store: "{{ playbook_dir }}/../../plans"
    basewright_plan_path: >-
      {{ basewright_plan_file
         | default(basewright_plan_store ~ '/plans/' ~ basewright_plan_id ~ '.json', true) }}
    basewright_plan: "{{ lookup('file', basewright_plan_path) | from_json }}"
    # Warnings are acknowledged before apply runs, not overridden while it does (ADR-0004).
    # There is no equivalent for a block, and there never will be: a plan cannot carry one.
    basewright_accept_warnings: false

  pre_tasks:
    - name: Insist on being told which plan to apply
      ansible.builtin.assert:
        that: (basewright_plan_file is defined) or (basewright_plan_id is defined)
        fail_msg: >-
          Give this either a plan id, with -e basewright_plan_id=..., or a path, with
          -e basewright_plan_file=.... An id is what the plan step printed and what the
          Apply template takes; a path is for running this by hand.
        success_msg: applying {{ basewright_plan_path }}
      run_once: true
      delegate_to: localhost

    # Once per host rather than once per run, and the two are the same thing here: a plan is
    # built from one host's facts, and the drift check below refuses it against any other.
    - name: Read the plan back through the tool that wrote it
      ansible.builtin.command:
        cmd: >-
          {{ ansible_playbook_python }} -m basewright.cli plan
          --from {{ basewright_plan_path | quote }}
      changed_when: false
      delegate_to: localhost
      become: false

    # Collected, not written down. A document records the moment it was collected, so
    # writing one here would report a change on every run of the one step that has to be
    # idempotent. The answer still goes through the same filter the collecting role's
    # template uses, so there is one definition of what a host is and this reads it.
    - name: Read what the host is now
      ansible.builtin.include_role:
        name: gather
      vars:
        gather_write: false

    - name: Refuse a host that is no longer the one the plan was built from
      ansible.builtin.assert:
        that: basewright_drift | length == 0
        fail_msg: |-
          {{ basewright_plan_path }} was built from a machine this host is no longer.

          {{ basewright_drift | join('

          ') }}

          Produce a fresh plan against this host and have it approved. Applying a plan
          whose facts have moved is how an instance ends up sized for hardware it is not
          running on.
        success_msg: >-
          the host still matches the facts this plan was built from, as far as the plan
          records them
      vars:
        basewright_drift: >-
          {{ basewright_plan | basewright_drift(gather_collected | basewright_document) }}

    - name: Refuse to apply warnings nobody has acknowledged
      ansible.builtin.assert:
        that: not basewright_plan.result.warnings_require_acknowledgement | bool
              or basewright_accept_warnings | bool
        fail_msg: >-
          This plan carries {{ basewright_plan.result.warnings }} warnings, and somebody
          has to say they have read them. Run the plan through `basewright plan --from` to
          see them, then run this again with -e basewright_accept_warnings=true. Silent
          warnings stop being read within a month, which is the whole reason for this.

  # The phases, in the order the plan lists its own changes in. That is not a coincidence
  # and it is not decoration: `changes` is the list somebody read and approved, and a step
  # that executed it in a different order would be doing something other than what was
  # approved. The shared phases fall between the engine's, which is why each role is
  # entered per phase rather than once -- a profile whose vendor package makes the service
  # account cannot have its directories owned before the packages are there.
  #
  # The plan names the engine and the engine's role is what knows what the values are for.
  # Nothing above this line has learned one, and nothing here decides which: the document
  # says, and the document is what a person approved.
  tasks:
    - name: Add the repository the packages come from, and install them
      ansible.builtin.include_role:
        name: "{{ basewright_plan.profile.engine }}"
        tasks_from: packages

    - name: Make the account the instance runs as, and the directories it lives in
      ansible.builtin.include_role:
        name: common
        tasks_from: layout

    - name: Create the instance
      ansible.builtin.include_role:
        name: "{{ basewright_plan.profile.engine }}"
        tasks_from: initialize

    - name: Write the configuration files the plan names
      ansible.builtin.include_role:
        name: "{{ basewright_plan.profile.engine }}"
        tasks_from: configure

    - name: Set the host settings the instance needs
      ansible.builtin.include_role:
        name: common
        tasks_from: settings

    - name: Enable the instance, start it, and store the secrets it needs
      ansible.builtin.include_role:
        name: "{{ basewright_plan.profile.engine }}"
        tasks_from: start

  # Last, and only if everything above it worked. The note says which plan this instance is
  # supposed to match from now on, which is what lets the Verify template take a host and an
  # instance name rather than an id nobody would remember (§12).
  #
  # It is one line, overwritten every time. There is no history in it and no who: an audit
  # trail is Phase E, and half of one would look like a record while answering none of the
  # questions a record is asked.
  #
  # Where the note goes is decided by `basewright_pointer` and written here. Every part of
  # that path comes from a name somebody typed into a survey field, so building it is a
  # question with a wrong answer -- and writing a line into a file is not (ADR-0008).
  post_tasks:
    - name: Note which plan this instance is now running
      ansible.builtin.copy:
        content: "{{ basewright_plan.plan_id }}\n"
        dest: "{{ basewright_plan | basewright_pointer(basewright_plan_store) }}"
        mode: "0640"
      delegate_to: localhost
      become: false
