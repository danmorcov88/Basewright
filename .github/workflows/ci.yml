---
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: |
          python -m ruff check basewright test tools
          python -m ruff format --check basewright test tools

      - name: Mypy
        run: python -m mypy

      - name: Yamllint
        run: python -m yamllint -s .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Pytest
        run: python -m pytest --cov --cov-report=term-missing

  guard:
    name: Engines are data
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      # The core must not know the name of any database engine. This job exists
      # separately from the test suite so the failure is unmistakable in the
      # pull request checks.
      - name: No engine name in the core
        run: python -m pytest test/unit -k engine_names -v

  assets:
    name: Documentation assets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      # Every diagram and every terminal capture in the documentation is generated,
      # so a picture cannot quietly stop matching what it illustrates. Captures are
      # produced by running the command, which is also why they cannot show a verb
      # working before it works.
      - name: Committed assets match what the renderer produces
        run: python tools/render_assets.py --check

  docs:
    name: Docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Every architecture decision the README points at has to exist.
      - name: Referenced ADRs exist
        run: |
          missing=0
          for adr in $(grep -oE 'docs/adr/[0-9]{4}-[a-z0-9-]+\.md' README.md | sort -u); do
            if [ ! -f "$adr" ]; then
              echo "README references a missing decision record: $adr"
              missing=1
            fi
          done
          exit "$missing"
