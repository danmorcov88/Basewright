---
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: |
          python -m ruff check basewright test tools
          python -m ruff format --check basewright test tools

      - name: Mypy
        run: python -m mypy

      - name: Yamllint
        run: python -m yamllint -s .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Pytest
        run: python -m pytest --cov --cov-report=term-missing

  guard:
    name: Engines are data
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      # The core must not know the name of any database engine. This job exists
      # separately from the test suite so the failure is unmistakable in the
      # pull request checks.
      - name: No engine name in the core
        run: python -m pytest test/unit -k engine_names -v

  schema:
    name: Profile schema
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      # Every profile that lands in the repository has to load. There are none yet, and
      # the command says so out loud rather than passing quietly over an empty directory.
      - name: Every profile in the repository validates
        run: python -m basewright.profiles --all profiles

      # The schemas are closed, the fixtures exercise them, and the plan contract accepts
      # a plan and refuses one carrying a secret value.
      - name: Schemas and fixtures
        run: python -m pytest test/unit -k schema -v

  plan:
    name: Plan determinism
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      # The same facts and the same profiles have to produce the same plan, byte for
      # byte. Everything else about golden plans rests on this: a committed plan is only
      # a review mechanism while a diff means a decision changed rather than a run happened.
      - name: The same inputs twice produce the same bytes
        run: |
          python tools/render_goldens.py
          git diff --exit-code -- test/golden
          python tools/render_goldens.py
          git diff --exit-code -- test/golden

      # A change to a sizing rule shows up in the pull request as a diff of the values it
      # produced on five real machines. A stale golden means that review did not happen.
      - name: Committed golden plans match what the pipeline produces
        run: python tools/render_goldens.py --check

  assets:
    name: Documentation assets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      # Every diagram and every terminal capture in the documentation is generated,
      # so a picture cannot quietly stop matching what it illustrates. Captures are
      # produced by running the command, which is also why they cannot show a verb
      # working before it works.
      - name: Committed assets match what the renderer produces
        run: python tools/render_assets.py --check

  ansible:
    name: Ansible
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev,ansible]"

      # Every playbook, role and scenario, at ansible-lint's production profile. The
      # collecting role is shared -- it runs whatever is being provisioned -- so it is held
      # to the same standard as the Python core rather than to a lower one for being YAML.
      - name: Lint every playbook and role
        run: python -m ansiblelint
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/ansible.cfg

  molecule:
    name: Molecule
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev,ansible]"

      # The collecting role, run against real containers with systemd up, so that services
      # are enumerated the way they will be on a server rather than the way they are in a
      # container that has no init. The scenario's verify step is the point: it reads the
      # document back through the core and refuses one the core would not accept.
      #
      # Idempotence is deliberately not in the sequence. A collector records the moment it
      # looked, so a second run writes a different file, and asserting otherwise would mean
      # this role reporting a fresh observation as no change. What that check would have
      # been worth here is asserted directly, in test/unit/test_gather_is_read_only.py.
      - name: The collecting role, against Ubuntu and Debian
        run: python -m molecule test -s gather
        env:
          MOLECULE_GLOB: test/molecule/*/molecule.yml
          ANSIBLE_CONFIG: ${{ github.workspace }}/ansible.cfg
          PY_COLORS: "1"

  docs:
    name: Docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Every architecture decision the README points at has to exist.
      - name: Referenced ADRs exist
        run: |
          missing=0
          for adr in $(grep -oE 'docs/adr/[0-9]{4}-[a-z0-9-]+\.md' README.md | sort -u); do
            if [ ! -f "$adr" ]; then
              echo "README references a missing decision record: $adr"
              missing=1
            fi
          done
          exit "$missing"
