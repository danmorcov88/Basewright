---
# What the scenario is actually for. That apply ran without failing proves very little; the
# instance being the one the plan described is the whole claim, and `verify` is the thing
# that makes it. So this runs the verify playbook rather than asserting its way to the same
# answer: the ten hand-written assertions that used to be here were the scenario checking
# its own work, and a scenario checking its own work is not a product that verifies.
#
# Then it breaks something, and insists the tool goes red. That is the half that matters.
# A verify that passes proves the checks agree with a correct instance; only a verify that
# fails on a changed one proves they were looking.
- name: Verify the instance against the plan it was built from
  ansible.builtin.import_playbook: ../../../ansible/playbooks/verify.yml
  vars:
    basewright_plan_file: >-
      {{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/facts/plan.json
    basewright_observation_dir: >-
      {{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/observations

- name: Change the instance, and insist verify says so
  hosts: all
  gather_facts: true

  vars:
    ephemeral: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}"
    project: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
    plan_path: "{{ ephemeral }}/facts/plan.json"
    plan: "{{ lookup('file', plan_path) | from_json }}"
    changed_observation: "{{ ephemeral }}/observations/changed.json"

  tasks:
    # ALTER SYSTEM rather than editing the drop-in, and deliberately: it is what somebody
    # in a hurry actually does, it survives a reload, and it is read after every
    # configuration file -- so it is the exact shape of the drift this check exists to
    # catch. A plan describes a machine; six months later somebody widens a setting to get
    # through an afternoon, and nothing says so until this runs.
    - name: Widen a parameter behind the plan's back
      ansible.builtin.command:
        argv:
          - psql
          - --no-psqlrc
          - --port={{ plan.request.port }}
          - --command=ALTER SYSTEM SET work_mem = '64MB'
      become: true
      become_user: "{{ plan.layout.service_account.name }}"
      changed_when: true

    - name: Make the instance read it
      ansible.builtin.systemd_service:
        name: "{{ plan.packages.service }}"
        state: reloaded
      become: true

    - name: Read the instance again
      ansible.builtin.include_role:
        name: "{{ plan.profile.engine }}"
        tasks_from: observe
      vars:
        basewright_plan: "{{ plan }}"

    - name: Write down what it says now
      ansible.builtin.copy:
        content: >-
          {{ basewright_observed
             | basewright_observation(plan, ansible_facts.date_time.iso8601)
             | to_nice_json(indent=2, sort_keys=True) }}
        dest: "{{ changed_observation }}"
        mode: "0640"
      delegate_to: localhost
      become: false

    # Exactly 2, not merely non-zero. Two is "the document was read and it is not
    # acceptable", which is a different answer from "the request was malformed" -- and a
    # scenario that accepted any failure would pass just as happily if verify had crashed.
    - name: Verify refuses an instance somebody has changed
      ansible.builtin.command:
        cmd: >-
          {{ ansible_playbook_python }} -m basewright.cli verify
          --plan {{ plan_path | quote }}
          --observed {{ changed_observation | quote }}
        chdir: "{{ project }}"
      changed_when: false
      failed_when: false
      delegate_to: localhost
      become: false
      register: refused

    - name: Say what it refused, and why
      ansible.builtin.debug:
        msg: "{{ refused.stdout_lines + refused.stderr_lines }}"

    - name: It went red, it named the parameter, and it went red for the right reason
      ansible.builtin.assert:
        that:
          - refused.rc == 2
          - "'work_mem' in report"
          - "'FAILED' in report"
        fail_msg: >-
          A parameter on this instance was changed behind the plan's back and verify
          exited {{ refused.rc }}. This is the check the whole verb exists for: a report
          that stays green after somebody changes the instance is worse than no report,
          because the plan then documents a machine that does not exist and nothing says
          so.
        success_msg: >-
          verify refused the changed instance and named work_mem
      vars:
        report: "{{ refused.stdout + refused.stderr }}"

    # Left here rather than turned into a verify check, and this is the whole of what did
    # not move. Verify judges the instance; these two are about the artifact and about the
    # control node. The plan having nowhere to put a password is a property of the document
    # somebody attaches to a change request, and the store being a 0600 file is a property
    # of the machine the run happened on -- neither is something a running database could
    # be asked.
    - name: The secret exists where the plan said it would, and nowhere else
      ansible.builtin.stat:
        path: "{{ ephemeral }}/secrets/{{ plan.secrets[0].location }}"
      delegate_to: localhost
      become: false
      register: stored

    - name: It was written once, readable by nobody else, and never into the plan
      ansible.builtin.assert:
        that:
          - stored.stat.exists
          - stored.stat.mode == '0600'
          - plan.secrets[0].keys() | list | sort == ['description', 'location', 'name']
        fail_msg: >-
          A generated password is written once to the store and named in the plan, never
          carried by it. There is deliberately nowhere in a plan's secret for a value.
