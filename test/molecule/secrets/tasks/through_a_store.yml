---
# One store, asked the same question twice in the same run. Included per store, so a third
# implementation is proved by adding its name to the role's defaults and nothing else.

- name: Store a secret for the first time, through {{ store }}
  ansible.builtin.include_role:
    name: common
    tasks_from: secret
  vars:
    common_secret_store: "{{ store }}"
    common_secret:
      name: admin
      location: "basewright/molecule/{{ store }}/admin"

- name: Remember what it handed back
  ansible.builtin.set_fact:
    stored_value: "{{ common_secret_value }}"
  no_log: true

- name: Ask for that same secret again, through {{ store }}
  ansible.builtin.include_role:
    name: common
    tasks_from: secret
  vars:
    common_secret_store: "{{ store }}"
    common_secret:
      name: admin
      location: "basewright/molecule/{{ store }}/admin"

# This is the contract every store keeps, and the only one an engine role depends on: the
# value that comes back is the value that went in, and the second run knows it did not
# generate it. A store that failed this would not fail loudly -- it would quietly issue a
# password nobody has, on a database somebody is already using.
- name: It handed back what it held rather than a new secret, through {{ store }}
  ansible.builtin.assert:
    that:
      - not (common_secret_is_new | bool)
      - common_secret_value == stored_value
      - common_secret_value | length == 32
      - common_secret_value is match('^[A-Za-z0-9]+$')
    fail_msg: >-
      The {{ store }} store was asked twice for one secret and did not answer the same way
      twice. A second apply of a plan must hand back the password the first one generated;
      rolling a new one locks out whoever was given the first, and nothing says so until
      somebody tries to connect.
    success_msg: >-
      The {{ store }} store generated once and handed the same value back
