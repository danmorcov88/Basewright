---
# Every store this installation declares, put through the same include an engine role uses,
# twice each. The second time is the one that matters: it is the second apply of the same
# plan, and what it has to hand back is what the first one generated.
- name: Store a secret through each sink, and then ask for it again
  hosts: all
  gather_facts: false

  vars:
    ephemeral: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}"
    # Both stores keep their files on the control node, so this is where they go rather
    # than in the home directory of whoever ran the scenario.
    common_secret_dir: "{{ ephemeral }}/secrets"
    # A literal, and it is allowed to be one here for the same reason the inventory in
    # test/fixtures is allowed to describe machines nobody owns: this key protects nothing.
    # On an installation it is injected at run time and never written down beside what it
    # protects, which is the whole of what the store buys.
    common_secret_vault_password: molecule-holds-no-real-key
    project: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"

  tasks:
    # Read out of the role's own defaults rather than listed here. A store added to that
    # list and to nothing else is a store this scenario starts proving on its first run,
    # which is what makes the sink an extension point rather than a claim about one.
    - name: Find out which stores this installation says it can write to
      ansible.builtin.include_vars:
        file: "{{ project }}/ansible/roles/common/defaults/main.yml"
        name: shared

    - name: There is more than one, or this scenario is proving nothing it needs a loop for
      ansible.builtin.assert:
        that: shared.common_secret_stores | length > 1
        fail_msg: >-
          common_secret_stores holds {{ shared.common_secret_stores | join(', ') }}. This
          scenario exists to prove the sink dispatches, and a sink with one implementation
          behind it has never been asked to.

    - name: Put a secret through each of them
      ansible.builtin.include_tasks: tasks/through_a_store.yml
      loop: "{{ shared.common_secret_stores }}"
      loop_control:
        loop_var: store
        label: "{{ store }}"
