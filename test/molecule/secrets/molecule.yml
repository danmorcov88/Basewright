---
# The scenario that proves the secret sink, and both implementations behind it.
#
# The target is deliberately plain. Every store this role ships writes to the *control*
# node -- that is what §11 asks for and what ADR-0007 records -- so systemd, a package
# manager and a real filesystem layout would all be scenery. What the container is for is
# that this runs the way the other two scenarios run: a play, against a host, through the
# same role an apply enters.
#
# Idempotence is in the sequence, and it is half the point. A store that rolled a new
# password on the second run would lock out whoever was given the first, and the only
# difference between "generates once" and "generates every time" is a run that reports a
# change when it should report none.
scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/ansible/roles

driver:
  name: docker
platforms:
  - name: secrets-ubuntu2404
    image: ubuntu:24.04
    pre_build_image: true
    command: sleep infinity
