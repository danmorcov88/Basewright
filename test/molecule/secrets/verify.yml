---
# What converge cannot show. Converge proves the two stores keep the same promise; this
# proves they keep it differently, which is the only reason there are two of them.
- name: Look at what each store actually left on disk
  hosts: all
  gather_facts: false

  vars:
    ephemeral: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}"
    common_secret_dir: "{{ ephemeral }}/secrets"
    common_secret_vault_password: molecule-holds-no-real-key
    plain_path: "{{ ephemeral }}/secrets/basewright/molecule/file/admin"
    vault_path: "{{ ephemeral }}/secrets/basewright/molecule/vault/admin"

  tasks:
    - name: Read what the two stores wrote
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - "{{ plain_path }}"
        - "{{ vault_path }}"
      loop_control:
        label: "{{ item | basename }} in {{ item | dirname | basename }}"
      delegate_to: localhost
      become: false
      register: written
      no_log: true

    - name: And how they left it
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ plain_path }}"
        - "{{ vault_path }}"
      delegate_to: localhost
      become: false
      register: modes

    - name: Neither store leaves a secret anybody on the control node can read
      ansible.builtin.assert:
        that: item.stat.exists and item.stat.mode == '0600'
        fail_msg: >-
          {{ item.stat.path }} is mode {{ item.stat.mode | default('absent') }}. A store
          that writes a password every account on the control node can read has not stored
          it, it has published it.
      loop: "{{ modes.results }}"
      loop_control:
        label: "{{ item.stat.path | default('?') | basename }}"

    # The file store, doing exactly what it says it does. Asserted rather than assumed,
    # because "the default store keeps plaintext" is the sentence the documentation and
    # STATUS both rest on, and a default that had quietly started encrypting would make
    # every warning about it wrong.
    - name: The file store holds the password itself, which is what it is honest about
      ansible.builtin.assert:
        that:
          - plain is not match('\$ANSIBLE_VAULT')
          - plain | length == 32
          - plain is match('^[A-Za-z0-9]+$')
        fail_msg: >-
          The file store did not write a 32-character password. It is the default and the
          documentation describes it exactly; a change here is a change to what an
          unconfigured control node does with a generated password.
        success_msg: >-
          The file store wrote the password, readable by its owner and nobody else
      vars:
        plain: "{{ written.results[0].content | b64decode | trim }}"
      no_log: true

    # The vault store, and the whole of what it is for. Three separate claims: the file is
    # a real ansible-vault file, the password is not in it, and the key opens it.
    - name: The vault store holds something the key opens and nothing else does
      ansible.builtin.assert:
        that:
          - blob is match('\$ANSIBLE_VAULT;1\.[12];AES256')
          - opened | length == 32
          - opened is match('^[A-Za-z0-9]+$')
          - opened not in blob
        fail_msg: >-
          The vault store wrote something that is not a vault file, or wrote the password
          where a vault file was expected. This is the store that exists so that a copy of
          the control node's disk is not a copy of every password Basewright has generated.
        success_msg: >-
          The vault store wrote an encrypted file, and the key it was given opens it
      vars:
        blob: "{{ written.results[1].content | b64decode }}"
        opened: >-
          {{ written.results[1].content | b64decode
             | ansible.builtin.unvault(common_secret_vault_password) }}
      no_log: true

    # An ordinary vault file, deliberately, because the point of choosing ansible-vault over
    # something of this project's own is that getting a password back needs no tool an
    # Ansible estate does not already have. This is that claim, executed.
    - name: Give the command the key the same way an operator would
      ansible.builtin.copy:
        content: "{{ common_secret_vault_password }}"
        dest: "{{ ephemeral }}/vault-password"
        mode: "0600"
      delegate_to: localhost
      become: false
      no_log: true

    - name: An operator with the key gets the password back with the command they already have
      ansible.builtin.command:
        argv:
          - ansible-vault
          - view
          - --vault-password-file
          - "{{ ephemeral }}/vault-password"
          - "{{ vault_path }}"
      environment:
        ANSIBLE_NOCOLOR: "1"
      changed_when: false
      delegate_to: localhost
      become: false
      register: viewed
      no_log: true

    - name: It was the password the store handed the role
      ansible.builtin.assert:
        that: viewed.stdout | trim == opened
        fail_msg: >-
          `ansible-vault view` did not return what the store holds. Retrieving a password
          is the one thing this store makes harder than the default, and it is only
          acceptable because the command that does it is one every Ansible estate has.
        success_msg: >-
          ansible-vault view returned the stored password
      vars:
        opened: >-
          {{ written.results[1].content | b64decode
             | ansible.builtin.unvault(common_secret_vault_password) }}
      no_log: true

    # The refusal. A store that wrote something unencrypted when it was given no key would
    # be worse than the default, because the default does not claim to be protecting
    # anything.
    - name: A vault store given no key refuses rather than writing something that looks protected
      block:
        - name: Try to store a secret with no key
          ansible.builtin.include_role:
            name: common
            tasks_from: secret
          vars:
            common_secret_store: vault
            common_secret_vault_password: ""
            common_secret:
              name: admin
              location: basewright/molecule/keyless/admin

        - name: Record that it went through
          ansible.builtin.set_fact:
            keyless_was_written: true
      rescue:
        - name: Record that it was refused
          ansible.builtin.set_fact:
            keyless_was_written: false

    - name: Nothing was written, and nothing was left behind
      ansible.builtin.stat:
        path: "{{ ephemeral }}/secrets/basewright/molecule/keyless/admin"
      delegate_to: localhost
      become: false
      register: keyless

    - name: It refused, and it refused before generating anything
      ansible.builtin.assert:
        that:
          - not keyless_was_written
          - not keyless.stat.exists
        fail_msg: >-
          The vault store was given no key and did not refuse. A generated password written
          without the key that was supposed to protect it is the failure this store exists
          to prevent, and it is silent -- the run goes green and the file looks stored.
        success_msg: >-
          The vault store refused a run that gave it no key, and generated nothing
