---
engine: exampledb
paths:
  data:
    default: /var/lib/basewright/{{ engine }}/{{ instance }}/data
    mode: "0700"
    min_free: 20GB
    description: Table and index files. Sized for growth, not for the initial import.
  journal:
    default: /var/lib/basewright/{{ engine }}/{{ instance }}/journal
    mode: "0700"
    min_free: 10GB
    description: The write-ahead journal. Ideally on a separate mount from the data path.
  log:
    default: /var/log/basewright/{{ engine }}/{{ instance }}
    mode: "0750"
    min_free: 2GB
    description: Server logs, rotated by the packaged configuration.
  backup:
    default: /backup/{{ engine }}/{{ instance }}
    mode: "0750"
    min_free: 50GB
    description: >-
      Where a backup tool would write. Basewright creates the path and proves the service
      account can write to it; scheduling backups is another tool's job.
service_account:
  name: exampledb
  create_if_missing: true
  shell: /usr/sbin/nologin
  group: exampledb
