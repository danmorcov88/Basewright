---
engine: exampledb
minimums:
  cores: 2
  memory: 2GB
preferences:
  filesystems: [ext4, xfs]
  transparent_hugepages: [madvise, never]
  max_swappiness: 10
conflicts:
  - service: exampledb
    match: prefix
    description: an instance of this engine, from the vendor packages
rules:
  - id: exampledb.port.unprivileged
    severity: block
    title: A port the service account can bind without privilege
    expr: request.port > 1024
    remediation: >-
      Choose a port above 1024. The service account this engine runs as is unprivileged
      and cannot bind a reserved port, so an instance configured with one starts as root
      or does not start at all.
  - id: exampledb.memory.headroom
    severity: warn
    title: Memory free for the instance to grow into
    expr: host.memory.available_bytes >= host.memory.total_bytes / 4
    remediation: >-
      Free memory before provisioning, or size the instance for what is actually
      available. A quarter of memory is what the default parameters assume they can take,
      and taking it from a machine that has not got it means swapping.
  - id: exampledb.storage.rotational
    severity: warn
    title: Data directory on rotational storage
    expr: not path.data.rotational
    applies_to: path.data.rotational is not none
    remediation: >-
      Move the data path to solid state storage if the workload is latency sensitive.
      Rotational storage is supported and will be sized for, but it is not the assumption
      the default parameters are written against.
