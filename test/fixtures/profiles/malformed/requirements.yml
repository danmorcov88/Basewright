---
engine: malformed
rules:
  - id: malformed.mem.min_total
    severity: fatal
    title: Enough memory to run an instance at all
    expr: host.memory.total_bytes >= 2 * GiB
    remediation: Give the host at least 2 GiB of memory.
  - id: malformed.cpu.min_cores
    severity: warn
    override: true
    title: Enough cores for the background workers
    expr: host.cpu.cores >= 2
    remediation: Give the host at least 2 cores.
