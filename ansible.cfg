# Ansible reads this from the working directory, and every entry point in this repository
# runs from the repository root. It is here because the tool requires it here, which is the
# only reason anything is at the root.
[defaults]
roles_path = ansible/roles
filter_plugins = ansible/plugins/filter
inventory = ansible/inventory/example
stdout_callback = default
interpreter_python = auto_silent
callbacks_enabled = profile_tasks

[ssh_connection]
pipelining = True
