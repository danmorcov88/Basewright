---
engine: postgresql
# What "this instance matches its plan" means for this engine. Every check names a kind,
# the engine's role observes each kind against the running cluster, and the core judges the
# observation against the plan without ever learning what a cluster is.
#
# A title here says what is actually judged rather than what would be nice to judge. Two of
# them were narrowed when the judgement was written: the plan carries no listen address, so
# the port kind is about the port and the profile's expression is what adds the address; and
# no verify step should guess at passwords, so the account kind asks whether one is set.
checks:
  - id: postgresql.service.running
    kind: service
    title: The cluster's unit is enabled and active
    remediation: >-
      Read the unit's journal and the cluster's own log. A cluster that will not start
      after a clean apply means the plan promised a configuration this host cannot honour,
      which is a finding about the plan rather than about the machine.

  - id: postgresql.port.listening
    kind: port
    title: On the planned port, on no other port, and on no address but loopback
    # The kind judges the port, because the port is what the plan carries. The address is
    # this profile's decision -- pg_hba grants nothing beyond loopback, and an instance
    # bound wider than that is reachable from a network nobody decided to expose it to --
    # so the profile is where it is asked, in the one place a reviewer arguing with it
    # would look.
    expr: observed.port.loopback_only
    remediation: >-
      Compare listen_addresses and port in the running configuration against the plan.
      Listening more widely than planned is the finding, not a detail: it is how a
      database ends up reachable from a network nobody decided to expose it to.

  - id: postgresql.connection.accepted
    kind: connection
    title: An authenticated connection succeeds
    remediation: >-
      The cluster is running and will not accept a connection, so the host-based
      authentication rules and the account do not agree with each other. Until this
      passes, nothing has been proved about the instance beyond the fact that it started.

  - id: postgresql.version.matches
    kind: version
    title: The reported server version is the one that was requested
    remediation: >-
      The packages installed are not the ones the plan named. Compare the repository
      configuration on the host with the one in the plan; a pinned version elsewhere on
      the machine is the usual cause.

  - id: postgresql.parameters.match
    kind: parameters
    title: Every parameter in the plan reads back with the planned value
    remediation: >-
      A parameter that does not read back was either overridden by a later configuration
      file or refused by the server at start-up. Both are worth knowing before anybody
      uses this instance, because the plan is otherwise a description of a machine that
      does not exist.

  - id: postgresql.paths.match
    kind: paths
    title: The data and the write-ahead log really live where the plan says
    remediation: >-
      The cluster is storing data somewhere the plan does not describe. Either the plan is
      no longer a description of this host, or a path override was applied and not
      recorded; either way the artifact somebody approved is not what ran.

  - id: postgresql.log.writing
    kind: log
    title: The log file exists and has grown since the service started
    remediation: >-
      A cluster that is running and writing no log is one nobody will be able to diagnose
      later. Check the logging configuration and the ownership of the log path.

  - id: postgresql.backup.writable
    kind: backup
    title: The service account can write to the backup path
    remediation: >-
      Correct the ownership or the mode of the backup path. A backup destination that
      cannot be written to is otherwise discovered at the one moment nobody has time to
      fix it.

  - id: postgresql.auth.no_trust
    kind: auth
    title: No password-free rule is reachable from a non-local address
    remediation: >-
      Remove the rule. An instance that trusts the network is not fit for production, and
      this check exists because it is an easy mistake to make while getting something
      working and a very hard one to notice afterwards.

  - id: postgresql.account.no_defaults
    kind: account
    title: Every role that can log in has a password set
    remediation: >-
      Set the password from the secret store, or remove the role's ability to log in. A
      role that anybody can connect as makes every other control on this list decorative.

  - id: postgresql.initialization.matches
    kind: initialization
    title: The cluster was created with the locale and settings the plan named
    remediation: >-
      The cluster is not the one the plan describes, and this is the finding on this page
      that cannot be corrected in place: the encoding, the locale and the checksum setting
      are fixed when the cluster is created, and changing any of them means dumping every
      database in it and reloading into a cluster made correctly. Verify says so now
      rather than leaving it to be discovered by the first name somebody types an accent
      into.
